<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Local Manga Translator options</title>
<style>
  body { font: 14px/1.5 system-ui, sans-serif; max-width: 560px; margin: 24px auto; padding: 0 16px; color: #111827; }
  input { width: 100%; padding: 7px; font: 13px ui-monospace, monospace; box-sizing: border-box; }
  button { margin-top: 8px; padding: 7px 14px; font: inherit; cursor: pointer; }
  .muted { color: #6b7280; font-size: 13px; }
</style>
</head>
<body>
  <h1>Local Manga Translator</h1>
  <label for="token">Service token</label>
  <input id="token" type="password" autocomplete="off" spellcheck="false">
  <p class="muted">Paste the contents of <code>service/token.txt</code> from the repo (created the first time the
    service starts). It's stored in this extension's local storage and only sent to http://127.0.0.1:8765.</p>
  <button id="save">Save</button> <span id="msg" class="muted"></span>
  <script src="options.js"></script>
</body>
</html>
