<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { font: 13px/1.45 system-ui, sans-serif; width: 320px; margin: 12px; color: #111827; }
  h1 { font-size: 14px; margin: 0 0 8px; }
  button { display: block; width: 100%; margin: 6px 0; padding: 7px; font: inherit; cursor: pointer; border-radius: 6px;
           border: 1px solid #cbd5e1; background: #f8fafc; }
  button.primary { background: #1d4ed8; color: #fff; border-color: #1d4ed8; }
  button:disabled { opacity: .5; cursor: default; }
  .muted { color: #6b7280; font-size: 12px; }
  .bad { color: #b91c1c; } .good { color: #15803d; }
  ul { margin: 4px 0; padding-left: 18px; font-size: 12px; word-break: break-all; }
</style>
</head>
<body>
  <h1>Local Manga Translator</h1>
  <div id="status" class="muted">Checking service…</div>
  <div id="site"></div>
  <button id="enable" class="primary" hidden>Enable on this site</button>
  <button id="inject" hidden>Add buttons to this tab only</button>
  <button id="all" hidden>Translate all pages in order</button>
  <button id="disable" hidden>Stop auto-enabling on this site</button>
  <p class="muted"><a href="options.html" target="_blank">Options / service token</a></p>
  <script src="popup.js"></script>
</body>
</html>
